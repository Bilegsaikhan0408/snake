<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1e1e1e;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
  }
  #hud {
    display: flex;
    gap: 24px;
    margin-bottom: 8px;
    font-size: 1rem;
  }
  canvas {
    background: #111;
    border: 2px solid #444;
    image-rendering: pixelated;
  }
  #message {
    margin-top: 10px;
    min-height: 1.4em;
    font-size: 1rem;
    color: #9fd39f;
  }
  #hint {
    margin-top: 4px;
    font-size: 0.8rem;
    color: #888;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="message"></div>
  <div id="hint">Arrow keys / WASD to move &middot; Space to pause &middot; Enter to restart</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var messageEl = document.getElementById("message");

  var CELL = 20;
  var COLS = canvas.width / CELL;
  var ROWS = canvas.height / CELL;
  var TICK_MS = 110;

  var best = Number(localStorage.getItem("snake-best") || 0);
  bestEl.textContent = best;

  var snake, dir, nextDir, food, score, running, paused, timer;

  function randomFood() {
    var cell;
    do {
      cell = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(function (s) { return s.x === cell.x && s.y === cell.y; }));
    return cell;
  }

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = score;
    food = randomFood();
    running = true;
    paused = false;
    messageEl.textContent = "";
    if (timer) clearInterval(timer);
    timer = setInterval(tick, TICK_MS);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem("snake-best", String(best));
      bestEl.textContent = best;
    }
    messageEl.textContent = "Game over — score " + score + ". Press Enter to restart.";
  }

  function tick() {
    if (paused) return;

    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }
    if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      food = randomFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#e04b4b";
    ctx.fillRect(food.x * CELL, food.y * CELL, CELL, CELL);

    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? "#9fd39f" : "#4caf50";
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function setDirection(x, y) {
    // Ignore reversals directly into the snake's own neck.
    if (snake.length > 1 && dir.x === -x && dir.y === -y) return;
    nextDir = { x: x, y: y };
  }

  var KEY_MAP = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      if (!running) reset();
      return;
    }
    if (e.key === " ") {
      if (running) {
        paused = !paused;
        messageEl.textContent = paused ? "Paused" : "";
      }
      e.preventDefault();
      return;
    }
    var mapped = KEY_MAP[e.key];
    if (mapped && running) {
      setDirection(mapped[0], mapped[1]);
      e.preventDefault();
    }
  });

  reset();
  draw();
})();
</script>
</body>
</html>
